name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Build integration-test binary
        run: cargo build --workspace
      - name: PowerShell integration syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell/module.Tests.ps1
      - name: Windows first-install execution policy
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/powershell/execution-policy.Tests.ps1
      - name: Bash integration syntax
        if: runner.os == 'Linux'
        shell: bash
        run: ./tests/bash/syntax.sh
